name: C5VRX-2 realtime build

on:
  push:
    branches: [realtime-iq-parlio]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C5 realtime firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32c5
          idf.py build
